services:
  postgres:
    image: postgres:17
    container_name: employee-management-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: employee_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - employee-network

  minio:
    image: pgsty/minio:latest
    container_name: employee-management-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    volumes:
      - minio_data:/data

    networks:
      - employee-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: employee-management-backend
    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/employee_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      - postgres
      - minio

    networks:
      - employee-network

  frontend:
    build:
      context: ./frontend/employee-management
      dockerfile: Dockerfile

    container_name: employee-management-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - employee-network

volumes:
  postgres_data:
  minio_data:

networks:
  employee-network:
    driver: bridge
